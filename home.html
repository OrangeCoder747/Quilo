<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <div class="bar">
        <div class="titles">
        <img class="logo" src="img/logo128.png">
        <h1 class="title">Quill</h1>
        </div>
        <button>Marketplace</button>
        <button>Sign In-Create</button>
        <button>Installed Mods</button>
    </div>

    <div class="mods">
    <h1 class="modtitle">Your Mods</h1>
    <div class="modsection" id="modsection">
        <div class="mtitles">
        <img class="modlogo" src="img/none.png">
        <h2 class="modname" id="modname">ModName</h2>
        </div>
        <p class="desc">Description</p>
        <button>View</button>
        <button>Run</button>
    </div>
    </div>
    </div>
</body>
</html>

<style>
    *{
        font-family: sans-serif;
    }

    html{width: 800px; height: 600px;}

    body {background-color: black;}

    button {
        cursor: pointer;
        transition-duration: 0.3s;
        border-radius: 6px;
        border: 0;
        padding: 4px;
        margin: 4px;
    }

    button:hover {font-size: 110%;}

    .bar {
        background-color: rgb(45, 192, 0);
        border-radius: 7px;
        padding: 4px;
        margin: 4px;
        width: 100%;
    }

    .title {
        color: rgb(4, 95, 231);
        position: relative;
        bottom: 35px;
        left: 10px;
        font-family: "Firjar";
        font-size: 45px;
    }

    .modtitle {
        color: white;
    }

    .modsection {
        background-color: rgb(35, 35, 35);
        border-radius: 5px;
        padding: 4px;
        margin: 4px;
    }

    .logo {
        width: 45px;
        height: 45px;
        border-radius: 5px;
    }

    .modlogo{
        width: 35px;
        height: 35px;
        border-radius: 5px;
    }

    .modname {
        color: white;
        position: relative;
        left: 10px;
        bottom: 12px;

    }

    .desc {
        color: white;;
    }

    .mtitles,.titles{display: flex;}

</style>

<script src="script.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Firjar:wght@100..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
